packages:
  - apps/*
  - packages/*
  - e2e

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# better-sqlite3 13 ships N-API prebuilds for every platform the image targets. Its implicit
# `node-gyp rebuild` would only check for them, and fails where Python is missing (Docker build).
ignoredBuiltDependencies:
  - better-sqlite3

patchedDependencies:
  '@liam-hq/schema@0.6.1': patches/@liam-hq__schema@0.6.1.patch

overrides:
  # @liam-hq/schema 0.6.1 and its @liam-hq/neverthrow pin valibot 1.1.0 (GHSA-vqpr-j7v3-hqw9, GHSA-5qjj-4xww-7phc).
  '@liam-hq/schema>valibot': ^1.5.0
  '@liam-hq/neverthrow>valibot': ^1.5.0

auditConfig:
  ignoreGhsas:
    # Zod memory exhaustion on oversized constrained collections. The only vulnerable copy left is
    # the zod 3 of @liam-hq/schema, used by its tbls parser alone: Liam loads that parser on demand
    # and RepoERD only ever asks for 'prisma' or 'drizzle' (packages/schema-core/src/parse/liam-parse.ts).
    - GHSA-mrhx-c7xc-m3w5
