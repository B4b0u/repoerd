name: Release

on:
  push:
    # Loose glob; check-tag-on-main.sh enforces strict semver (vX.Y.Z, vX.Y.Z-rc.1): anything else publishes nothing.
    # Note: `latest` follows the most recent non-prerelease tag pushed, so patching an older line moves it back.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions: {}

jobs:
  tag-on-main:
    name: Tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/check-tag-on-main.sh "$GITHUB_SHA" origin/main
        env:
          TAG_NAME: ${{ github.ref_name }}

  ci:
    name: CI
    needs: tag-on-main
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    name: Publish the image and the release
    runs-on: ubuntu-latest
    # Write access for this job only: the CI above runs with read access.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image name (GHCR wants lower case)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          # A pre-release (v1.0.0-rc.1) only gets its own tag. X.Y follows the patches of a line
          # (0.1 too); X starts at 1.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: repoerd:smoke-amd64
          build-args: REPOERD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
      - name: Smoke test of the amd64 image
        run: bash scripts/docker-smoke.sh repoerd:smoke-amd64
      - name: Build the arm64 image for the smoke test (QEMU)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          tags: repoerd:smoke-arm64
          build-args: REPOERD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
      - name: Smoke test of the arm64 image (QEMU)
        env:
          SMOKE_PLATFORM: linux/arm64
          SMOKE_WAIT_SECONDS: '180'
        run: bash scripts/docker-smoke.sh repoerd:smoke-arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish both architectures, with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: REPOERD_VERSION=${{ steps.meta.outputs.version }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes
          fi
