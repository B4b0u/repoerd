version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Patched with pnpm (patches/): a new version means redoing the patch and bumping CACHE_VERSION.
      - dependency-name: '@liam-hq/schema'
      # Follows the Node runtime (node:24 image, .nvmrc): bumped with the Node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 has no compiler API yet: dependency-cruiser silently stops seeing type-only
      # imports (tsPreCompilationDeps). Retry once it can parse with TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7']
      # msw 3.0.4: cancelling the body of a mocked HTTPS response leaves an OpenSSL error that the
      # next createSign() of the tests throws ("asn1 encoding routines::too long"). Retry later.
      - dependency-name: msw
        versions: ['>=3']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Node majors are updated by hand (only even majors are LTS).
      - dependency-name: node
        update-types: ['version-update:semver-major']
