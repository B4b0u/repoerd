name: Idea
description: Suggest a feature or an improvement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation and what is hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
